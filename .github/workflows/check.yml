name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Build and start the API
        run: docker compose up -d --build --wait
      - name: Check API and retired web routes
        run: |
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/api/cases > /tmp/cases.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; if(JSON.parse(readFileSync('/tmp/cases.json','utf8')).length !== 228) process.exit(1)"
          for path in / /index.html /aaaaadmin /pwa/icon-192.png /sw.js; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")" = 404
          done
      - name: Stop containers
        if: always()
        run: docker compose down
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libssl-dev desktop-file-utils
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - name: Check standalone engine and launcher
        run: |
          CUBIX_ENGINE_EXE="$PWD/artifacts/gpui/cubix-linux-x64/cubix-engine" bun desktop/engine/smoke.ts
          sed 's|@APP@|/usr/lib/cubix|g' desktop/linux/fr.vitrixxl.cubix.desktop > /tmp/cubix.desktop
          desktop-file-validate /tmp/cubix.desktop
      - name: Archive standalone desktop
        run: tar -C artifacts/gpui -czf artifacts/cubix-linux-x64.tar.gz cubix-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cubix-linux-x64
          path: artifacts/cubix-linux-x64.tar.gz
  release:
    needs: [test, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    concurrency:
      group: cubix-desktop-release
      cancel-in-progress: false
    steps:
      - name: Install packaging utilities
        run: pacman -Syu --noconfirm git github-cli
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cubix-linux-x64
          path: packaging/arch
      - name: Package prebuilt desktop
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' desktop/Cargo.toml | head -n1)
          version="$version.r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          useradd --create-home builder
          chown -R builder:builder packaging/arch
          cd packaging/arch
          runuser -u builder -- env CUBIX_PACKAGE_VERSION="$version" makepkg --nodeps --force
          cp cubix-bin-*.pkg.tar.zst cubix-linux-x86_64.pkg.tar.zst
          sha256sum cubix-linux-x86_64.pkg.tar.zst > cubix-linux-x86_64.pkg.tar.zst.sha256
          pacman -Qip cubix-linux-x86_64.pkg.tar.zst
      - name: Publish binary release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A slow older run must not replace a more recent release.
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; skipping this release.'
            exit 0
          fi
          tag="desktop-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This commit already has a release.'
            exit 0
          fi
          gh release create "$tag" \
            packaging/arch/cubix-linux-x86_64.pkg.tar.zst \
            packaging/arch/cubix-linux-x86_64.pkg.tar.zst.sha256 \
            packaging/arch/cubix-linux-x64.tar.gz \
            --target "$GITHUB_SHA" --title "Cubix desktop ${GITHUB_SHA:0:7}" \
            --notes 'Prebuilt Linux x86_64 desktop. Run ./update.sh to install without Rust or Bun. The Arch package replaces cubix-git and preserves application data.' \
            --latest
