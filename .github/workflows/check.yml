name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Build and start the API
        run: docker compose up -d --build --wait
      - name: Check API and retired web routes
        run: |
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/api/cases > /tmp/cases.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; if(JSON.parse(readFileSync('/tmp/cases.json','utf8')).length !== 228) process.exit(1)"
          # The image derives the mobile build number from the checkout's commit date.
          curl --fail http://localhost:3000/api/mobile/release > /tmp/release.json
          cat /tmp/release.json
          test "$(node -p "JSON.parse(require('fs').readFileSync('/tmp/release.json','utf8')).build")" = "$(( $(git log -1 --format=%ct) / 60 ))"
          # No APK is uploaded in CI; the route answers 404 until `bun run deploy` stores one.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/mobile/apk)" = 404
          for path in / /index.html /aaaaadmin /pwa/icon-192.png /sw.js; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")" = 404
          done
      - name: Stop containers
        if: always()
        run: docker compose down
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libssl-dev desktop-file-utils
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - name: Check standalone engine and launcher
        run: |
          CUBIX_ENGINE_EXE="$PWD/artifacts/gpui/cubix-linux-x64/cubix-engine" bun desktop/engine/smoke.ts
          sed 's|@APP@|/usr/lib/cubix|g' desktop/linux/fr.vitrixxl.cubix.desktop > /tmp/cubix.desktop
          desktop-file-validate /tmp/cubix.desktop
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile
      - name: Prepare the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without the secrets the APK keeps the generated debug key, like local builds.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key.'
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cubix.keystore"
          {
            echo "CUBIX_ANDROID_KEYSTORE=$RUNNER_TEMP/cubix.keystore"
            echo "CUBIX_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CUBIX_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "CUBIX_ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Build the ARM64 release APK
        working-directory: mobile
        run: |
          # Same build number as the Docker image: commit time in minutes.
          export CUBIX_BUILD_NUMBER=$(( $(git log -1 --format=%ct) / 60 ))
          export CUBIX_COMMIT=$GITHUB_SHA
          bun scripts/build-apk.ts --arm64 --output=build/cubix-android-arm64.apk
          sha256sum build/cubix-android-arm64.apk > build/cubix-android-arm64.apk.sha256
          ls -l build/cubix-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cubix-android-arm64
          path: |
            mobile/build/cubix-android-arm64.apk
            mobile/build/cubix-android-arm64.apk.sha256
