[package]
name = "cubix-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
reference = []

[dependencies]
gpui = "=0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
image = "0.25"
async-channel = "2"
unicode-segmentation = "1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
