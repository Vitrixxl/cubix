[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# iced from the Android fork (iced_android), on the desktop too: one iced for every platform.
iced = { git = "https://github.com/Santuzius/iced", tag = "iced_android-v0.1.2", default-features = false, features = ["wgpu", "x11", "wayland", "canvas", "image", "advanced", "thread-pool", "linux-theme-detection", "crisp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
