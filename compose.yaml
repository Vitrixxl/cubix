services:
  api:
    build:
      context: .
      # scripts/deploy.ts sets them for `pihost update` (the image reads no git history).
      args:
        CUBIX_BUILD_NUMBER: "${CUBIX_BUILD_NUMBER:-0}"
        CUBIX_COMMIT: "${CUBIX_COMMIT:-}"
    ports:
      - "${CUBIX_PORT:-3000}:3000"
    environment:
      CUBIX_HOST: 0.0.0.0
      PORT: "3000"
      CUBIX_DB: /var/lib/cubix/cubix.db
      CUBIX_ADMIN_PASSWORD: "${CUBIX_ADMIN_PASSWORD:-}"
      CUBIX_GOOGLE_CLIENT_ID: "${CUBIX_GOOGLE_CLIENT_ID:-}"
      CUBIX_RATE_LIMIT: "${CUBIX_RATE_LIMIT:-600}"
      CUBIX_TRUSTED_PROXIES: "${CUBIX_TRUSTED_PROXIES:-}"
    volumes:
      - cubix-data:/var/lib/cubix
      # The web app, sent by scripts/deploy.ts: dist/web links to its latest build, read at every request, so swapping
      # the link deploys it without restarting the server.
      - ./dist:/app/dist:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    init: true
    restart: unless-stopped
    # A leak or a flood stays inside the container instead of starving the Pi and its other apps.
    mem_limit: 1g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  cubix-data:
